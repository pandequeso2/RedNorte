#Inicio de yml
name: CI Pipeline #nombre del flujo completo

#acciones que ejecutan el archivo, cuando se haga cualquier pull request o se haga un push a la rama develop
on:
  pull_request:
  push:
    branches:
      - develop

#os jobs son trabajos a ejecutar
jobs:
  frontTest-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Frontend

    steps:
      - name: Checkout repository (git clone)
        uses: actions/checkout@v4 #Es lo mismo que hacer un git clone a la carpeta frontend del repositorio
      
      - name: Setup node (instalar node)
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          # cache: 'npm'
      - run: npm install
      - name: Ejecutar los Test
        run: npm test -- --watchAll=false


  backTest-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Backend
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'maven'
      - name: Dar Permisos a maven
        run: chmod +x mvnw
      - name: Ejecutar las pruebas
        run: ./mvnw compile




  front-build:
    needs: frontTest-build # NO construye si el test falla
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: Frontend

    steps:
      - name: Checkout repository (git clone)
        uses: actions/checkout@v4 #Es lo mismo que hacer un git clone a la carpeta frontend del repositorio
      
      - name: Setup node (instalar node)
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar las dependencias
        run: npm install

      - name: Construir la aplicacion
        run: npm run build 

  back-build:
    needs: backTest-build # NO construye si el test falla
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: Backend
    
    steps:
      - name: Checkout repository (git clone)
        uses: actions/checkout@v4

      - name: Setup JDK (Java) 25 #depende de la version de java del computador
        uses: actions/setup-java@v4
        #Paso extra, verificar que instale la version 21 d java
        with:
          java-version: '25'
          distribution: 'temurin' #distribuidora de maven
          cache: 'maven'
      - name: Dar permisos a maven de ejecucion #en ubuntu maven nesesita permisos para ejecutar el proyecto
        run: chmod +x mvnw

      - name: Construir la aplicación
        run: ./mvnw clean package -DskipTests