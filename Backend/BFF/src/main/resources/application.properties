# Configuración del servidor BFF
server.port=8080
spring.application.name=bff-service

# Configuración de CORS para permitir peticiones desde el frontend en React
spring.web.cors.allowed-origins=http://localhost:5173
spring.web.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
spring.web.cors.allowed-headers=*

# Configuración del Circuit Breaker (Resilience4j)
resilience4j.circuitbreaker.instances.listaEsperaService.registerHealthIndicator=true
resilience4j.circuitbreaker.instances.listaEsperaService.slidingWindowSize=10
resilience4j.circuitbreaker.instances.listaEsperaService.failureRateThreshold=50
resilience4j.circuitbreaker.instances.listaEsperaService.waitDurationInOpenState=10000