spring.application.name=Backend
server.port=8080

# ==========================================
# DATASOURCE PRINCIPAL - Pacientes, Citas, Especialidades
# ==========================================
spring.datasource.primary.jdbc-url=${PRIMARY_DB_URL:jdbc:mysql://localhost:3306/rednortedb}
spring.datasource.primary.username=${PRIMARY_DB_USERNAME:root}
spring.datasource.primary.password=${PRIMARY_DB_PASSWORD:}
spring.datasource.primary.driver-class-name=com.mysql.cj.jdbc.Driver

# ==========================================
# DATASOURCE LISTA DE ESPERA
# ==========================================
spring.datasource.espera.jdbc-url=${ESPERA_DB_URL:jdbc:mysql://localhost:3306/rednorte_espera}
spring.datasource.espera.username=${ESPERA_DB_USERNAME:root}
spring.datasource.espera.password=${ESPERA_DB_PASSWORD:}
spring.datasource.espera.driver-class-name=com.mysql.cj.jdbc.Driver

# ==========================================
# DATASOURCE NOTIFICACIONES
# ==========================================
spring.datasource.notificaciones.jdbc-url=${NOTIFICACIONES_DB_URL:jdbc:mysql://localhost:3306/rednorte_notificaciones}
spring.datasource.notificaciones.username=${NOTIFICACIONES_DB_USERNAME:root}
spring.datasource.notificaciones.password=${NOTIFICACIONES_DB_PASSWORD:}
spring.datasource.notificaciones.driver-class-name=com.mysql.cj.jdbc.Driver

# ==========================================
# DATASOURCE REASIGNACIONES
# ==========================================
spring.datasource.reasignaciones.jdbc-url=${REASIGNACIONES_DB_URL:jdbc:mysql://localhost:3306/rednorte_reasignaciones}
spring.datasource.reasignaciones.username=${REASIGNACIONES_DB_USERNAME:root}
spring.datasource.reasignaciones.password=${REASIGNACIONES_DB_PASSWORD:}
spring.datasource.reasignaciones.driver-class-name=com.mysql.cj.jdbc.Driver

# ==========================================
# JPA / HIBERNATE GENERAL
# ==========================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# ==========================================
# DESHABILITAR AUTOCONFIGURACION DE DATASOURCE
# Necesario al usar multiples datasources manuales
# ==========================================
spring.autoconfigure.exclude=org.springframework.boot.jdbc.autoconfigure.DataSourceAutoConfiguration,org.springframework.boot.hibernate.autoconfigure.HibernateJpaAutoConfiguration,org.springframework.boot.jdbc.autoconfigure.DataSourceTransactionManagerAutoConfiguration

# Circuit Breaker config
resilience4j.circuitbreaker.instances.reasignacion.sliding-window-size=10
resilience4j.circuitbreaker.instances.reasignacion.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.reasignacion.wait-duration-in-open-state=30s