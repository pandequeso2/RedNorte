spring.application.name=Backend
server.port=8080

# ==========================================
# DATASOURCE PRINCIPAL - Pacientes, Citas, Especialidades
# ==========================================
spring.datasource.primary.jdbc-url=jdbc:mysql://localhost:3306/rednortedb
spring.datasource.primary.username=root
spring.datasource.primary.password=
spring.datasource.primary.driver-class-name=com.mysql.cj.jdbc.Driver

# ==========================================
# DATASOURCE LISTA DE ESPERA
# ==========================================
spring.datasource.espera.jdbc-url=jdbc:mysql://localhost:3306/rednorte_espera
spring.datasource.espera.username=root
spring.datasource.espera.password=
spring.datasource.espera.driver-class-name=com.mysql.cj.jdbc.Driver

# ==========================================
# DATASOURCE NOTIFICACIONES
# ==========================================
spring.datasource.notificaciones.jdbc-url=jdbc:mysql://localhost:3306/rednorte_notificaciones
spring.datasource.notificaciones.username=root
spring.datasource.notificaciones.password=
spring.datasource.notificaciones.driver-class-name=com.mysql.cj.jdbc.Driver

# ==========================================
# DATASOURCE REASIGNACIONES
# ==========================================
spring.datasource.reasignaciones.jdbc-url=jdbc:mysql://localhost:3306/rednorte_reasignaciones
spring.datasource.reasignaciones.username=root
spring.datasource.reasignaciones.password=
spring.datasource.reasignaciones.driver-class-name=com.mysql.cj.jdbc.Driver

# ==========================================
# JPA / HIBERNATE GENERAL
# ==========================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# ==========================================
# DESHABILITAR AUTOCONFIGURACION DE DATASOURCE
# Necesario al usar multiples datasources manuales
# ==========================================
spring.autoconfigure.exclude=org.springframework.boot.jdbc.autoconfigure.DataSourceAutoConfiguration,org.springframework.boot.hibernate.autoconfigure.HibernateJpaAutoConfiguration,org.springframework.boot.jdbc.autoconfigure.DataSourceTransactionManagerAutoConfiguration
